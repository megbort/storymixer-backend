# Local development database. Not for production.
services:
  db:
    image: postgres:17
    container_name: storymixer-db
    environment:
      POSTGRES_USER: storymixer
      POSTGRES_PASSWORD: storymixer
      POSTGRES_DB: storymixer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storymixer -d storymixer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
